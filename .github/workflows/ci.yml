# Checks and builds Orcha for Windows. A v* tag also assembles a DRAFT
# release with the installer — published by hand, and never marked "latest":
# friends on 0.3 update from releases/latest and stay on 0.3.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Relay
        working-directory: relay
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:e2e

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: dist/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir upload
          cp artifacts/win-build/*-setup.exe upload/
          (cd upload && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          gh release create "$TAG" upload/* --repo "$GITHUB_REPOSITORY" --draft --latest=false --title "Orcha ${TAG#v}" --notes "Draft built by CI."
